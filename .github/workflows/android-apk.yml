name: Build SPAINOL APK

on:
  push:
    branches: [ "principal" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Get source code
        uses: actions/checkout@v4

      - name: Install Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Install Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"
      - name: Extract project
        run: unzip Spainol_projet_source.zip

      - name: Build APK
        run: |
          cd KombatCrossoverAndroid
          gradle --no-daemon assembleDebug

      - name: Save APK
        uses: actions/upload-artifact@v4
        with:
          name: SPAINOL-APK
          path: KombatCrossoverAndroid/app/build/outputs/apk/debug/*.apk
